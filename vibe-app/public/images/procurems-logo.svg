<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
  <title id="title">ProcureMS logo</title>
  <desc id="description">A navy and gold institutional emblem with a school roof, procurement document, and green approval seal beside the ProcureMS wordmark.</desc>
  <rect width="900" height="250" fill="#ffffff"/>

  <!-- Civic emblem -->
  <circle cx="126" cy="125" r="105" fill="#00236f"/>
  <circle cx="126" cy="125" r="95" fill="none" stroke="#d9ab54" stroke-width="3"/>
  <circle cx="126" cy="125" r="82" fill="#0b347c" stroke="#456ba5" stroke-width="1.5"/>
  <path d="M75 94 126 63l51 31" fill="none" stroke="#d9ab54" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 96h80" stroke="#d9ab54" stroke-width="4" stroke-linecap="round"/>
  <path d="M85 184c12 10 26 16 41 17 15-1 29-7 41-17" fill="none" stroke="#d9ab54" stroke-width="3" stroke-linecap="round"/>
  <circle cx="72" cy="151" r="3" fill="#d9ab54"/>
  <circle cx="180" cy="151" r="3" fill="#d9ab54"/>

  <!-- Ledger pages and completed transaction -->
  <path d="M90 108h72v68H90z" fill="#b8d5ff" opacity=".75"/>
  <path d="M96 102h58l13 13v67H96z" fill="#ffffff"/>
  <path d="M154 102v14h13" fill="#c8dcf7"/>
  <path d="M108 128h42M108 140h37M108 152h28" fill="none" stroke="#37609c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="165" r="24" fill="#006c4a" stroke="#ffffff" stroke-width="4"/>
  <path d="m149 165 7 7 15-17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="264" y="113" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="-2.8" fill="#00236f">Procure<tspan fill="#006c4a">MS</tspan></text>
  <path d="M266 131h556" stroke="#d9ab54" stroke-width="4" stroke-linecap="round"/>
  <text x="267" y="163" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.2" fill="#43546a">SCHOOL PROCUREMENT &amp; LIQUIDATION</text>
  <text x="268" y="190" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#6b7787">PLAN  ·  PROCURE  ·  ACCOUNT</text>
</svg>
